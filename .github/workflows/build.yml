name: Build pearl kernel (5.10.240 + SukiSU + SUSFS)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check disk & install deps
        run: |
          df -h /
          sudo apt-get update -qq
          sudo apt-get install -y -qq flex bison bc cpio zip unzip patch

      - name: Clone kernel source (ztc1997 / android12-5.10-2025-09)
        run: |
          git clone --depth=1 -b android12-5.10-2025-09 --recurse-submodules \
            https://github.com/ztc1997/android_gki_kernel_5.10_common.git kernel

      - name: Integrate KernelSU (SukiSU-Ultra latest)
        run: |
          cd kernel
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -
          (cd KernelSU && echo "KSU version: $(git describe --tags 2>/dev/null || git rev-parse --short HEAD)")

      - name: Fetch SUSFS v2.2.0 patches
        run: |
          mkdir -p susfs
          curl -L https://gitlab.com/simonpunk/susfs4ksu/-/archive/gki-android12-5.10/susfs4ksu-gki-android12-5.10.tar.gz \
            | tar xz --strip-components=1 -C susfs
          grep -m1 '^version=' susfs/ksu_module_susfs/module.prop

      - name: Apply SUSFS patches (10 -> KernelSU, 50 -> kernel)
        run: |
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch kernel/KernelSU/
          cp susfs/kernel_patches/fs/susfs.c kernel/fs/
          cp susfs/kernel_patches/include/linux/susfs.h kernel/include/linux/
          cp susfs/kernel_patches/include/linux/susfs_def.h kernel/include/linux/
          cd kernel/KernelSU
          patch -p1 -s < 10_enable_susfs_for_ksu.patch
          cd ../..
          cp susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch kernel/
          cd kernel
          patch -p1 -s < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Configure defconfig (KSU + SUSFS features)
        run: |
          cd kernel
          scripts/config --file arch/arm64/configs/gki_defconfig \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_SUS_MAP \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG
          scripts/config --file arch/arm64/configs/gki_defconfig -d CONFIG_LTO_CLANG_FULL -e CONFIG_LTO_CLANG_THIN
          scripts/config --file arch/arm64/configs/gki_defconfig -d CONFIG_DEBUG_INFO

      - name: Download AOSP clang r547379 (clang 19)
        run: |
          mkdir -p toolchain-clang
          curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz | tar xz -C toolchain-clang
          echo "$(pwd)/toolchain-clang/bin" >> "$GITHUB_PATH"

      - name: Build kernel (thin LTO, ~1-2h)
        run: |
          cd kernel
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            LTO=thin gki_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            LTO=thin -j"$(nproc)" Image
          cp out/arch/arm64/boot/Image ../Image
          ls -lh ../Image
          df -h /

      - name: Package AnyKernel3 zip + SUSFS module zip
        run: |
          git clone --depth=1 https://github.com/ztc1997/AnyKernel3.git ak3
          cp Image ak3/Image
          cat > ak3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          properties() { '
          kernel.string=GKI 5.10 (pearl) SukiSU+SUSFS
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          '; }
          attributes() {
          set_perm_recursive 0 0 755 644 $ramdisk/*;
          set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
          }
          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh && attributes;
          dump_boot;
          write_boot;
          EOF
          (cd ak3 && zip -r9 ../Kernel-pearl-5.10.240-KSU-SUSFS.zip . -x '.git/*')
          ls -lh Kernel-pearl-5.10.240-KSU-SUSFS.zip

      - name: Free disk space
        run: |
          rm -rf kernel ak3 susfs toolchain-clang pushdir
          df -h /

      - name: Push Image to built branch
        continue-on-error: true
        run: |
          mkdir pushdir && cd pushdir
          git init -q -b built
          cp ../Image .
          git config user.name "pearl-bot"
          git config user.email "bot@pearl.local"
          git add Image
          git commit -q -m "SukiSU image $(date -u +%Y%m%d%H%M)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/nn3456/pearl-kernel-build.git" built

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pearl-kernel-ksu-susfs
          path: |
            Kernel-pearl-5.10.240-KSU-SUSFS.zip
          if-no-files-found: error
          retention-days: 30
